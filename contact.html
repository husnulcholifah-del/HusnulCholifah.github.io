<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MOODLAB - Contact</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
<link rel="stylesheet" href="style.css">
</head>

<body>

  <section class="container my-5">
    <h2 class="fw-bold text-center mb-3">Contact MOODLAB</h2>
    <p class="text-muted text-center mb-5">
      For inquiries, partnerships, or customer assistance, please leave us a message below.
    </p>

    <div class="row justify-content-center">
      <div class="col-lg-6">
        <form class="p-5 shadow-sm rounded-5 bg-white contact-form">

          <div class="mb-4">
            <label class="form-label fw-semibold">Name</label>
            <input type="text" class="form-control" placeholder="Enter your name">
          </div>

          <div class="mb-4">
            <label class="form-label fw-semibold">Email</label>
            <input type="email" class="form-control" placeholder="Enter your email">
          </div>

          <div class="mb-4">
            <label class="form-label fw-semibold">Message</label>
            <textarea class="form-control" rows="4" placeholder="Write your message"></textarea>
          </div>

          <button type="submit" class="btn btn-dark w-100 rounded-pill py-2">
            Submit
          </button>

          <div class="text-center mt-4">
            <p class="text-muted small mb-2">Or contact us instantly via WhatsApp</p>

            <!-- WhatsApp Button -->
            <button type="button" class="btn btn-outline-dark rounded-pill px-4" data-bs-toggle="modal" data-bs-target="#waModal">
            <i class="bi bi-whatsapp me-2"></i> WhatsApp
            </button>
          </div>

        </form>
      </div>
    </div>
  </section>

  <!-- WhatsApp Modal -->
  <div class="modal fade" id="waModal" tabindex="-1" aria-labelledby="waModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content rounded-5">

        <div class="modal-header border-0 px-4 pt-4">
          <h5 class="modal-title fw-bold" id="waModalLabel">WhatsApp Message</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>

        <div class="modal-body px-4 pb-4">
          <p class="text-muted small">
            Send us a message directly via WhatsApp for faster assistance.
          </p>

          <div class="mb-3">
            <label class="form-label fw-semibold">Your Name</label>
            <input type="text" class="form-control" placeholder="Enter your name">
          </div>

          <div class="mb-3">
            <label class="form-label fw-semibold">Message</label>
            <textarea class="form-control" rows="3" placeholder="Write your message"></textarea>
          </div>

          <!-- WA Direct Link -->
          <a href="https://wa.me/625371024195" target="_blank" class="btn btn-dark w-100 rounded-pill py-2">
            Continue to WhatsApp
          </a>

        </div>

      </div>
    </div>
  </div>

  <footer class="footer-section text-center py-4 mt-5">
    <p class="mb-0">© 2024 MOODLAB. All Rights Reserved.</p>
  </footer>

  <!-- Bootstrap JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>

<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MOODLAB - Login</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <section class="container my-5">
    <div class="text-center mb-5">
      <h2 class="fw-bold">Account Login</h2>
      <p class="text-muted mb-0">
        Access your MOODLAB account securely.
      </p>
      <div class="about-line mx-auto mt-3"></div>
    </div>

    <div class="row justify-content-center">
      <div class="col-lg-5">
        <div class="checkout-box p-5 rounded-5 shadow-sm">

          <form>
            <div class="mb-4">
              <label class="form-label fw-semibold">Email</label>
              <input type="email" class="form-control" placeholder="Enter your email" required>
            </div>

            <div class="mb-4">
              <label class="form-label fw-semibold">Password</label>
              <input type="password" class="form-control" placeholder="Enter your password" required>
            </div>

            <!-- LOGIN BUTTON (redirect to profile.html) -->
            <a href="profile.html" target="contentFrame" class="btn btn-dark w-100 rounded-pill py-2">
              Login
            </a>

            <p class="text-muted small mt-4 text-center mb-0">
              New to MOODLAB?
              <a href="register.html" target="contentFrame" class="text-decoration-none">
                Create an account
              </a>
            </p>
          </form>

        </div>
      </div>
    </div>
  </section>

  <footer class="footer-section text-center py-4 mt-5">
    <p class="mb-0">© 2024 MOODLAB. All Rights Reserved.</p>
  </footer>

</body>
</html>

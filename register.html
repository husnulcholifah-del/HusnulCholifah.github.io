<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MOODLAB - Register</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <section class="container my-5">
    <div class="text-center mb-5">
      <h2 class="fw-bold">Create Account</h2>
      <p class="text-muted mb-0">
        Register to access MOODLAB exclusive services.
      </p>
      <div class="about-line mx-auto mt-3"></div>
    </div>

    <div class="row justify-content-center">
      <div class="col-lg-6 col-md-8">
        <div class="checkout-box p-5 rounded-5 shadow-sm">

          <form>

            <div class="row g-3">
              <div class="col-md-6">
                <label class="form-label fw-semibold">First Name</label>
                <input type="text" class="form-control" placeholder="Enter first name" required>
              </div>

              <div class="col-md-6">
                <label class="form-label fw-semibold">Last Name</label>
                <input type="text" class="form-control" placeholder="Enter last name" required>
              </div>
            </div>

            <div class="mt-3">
              <label class="form-label fw-semibold">Email</label>
              <input type="email" class="form-control" placeholder="example@email.com" required>
            </div>

            <div class="mt-3">
              <label class="form-label fw-semibold">Phone Number</label>
              <input type="text" class="form-control" placeholder="+62" required>
            </div>

            <div class="mt-3">
              <label class="form-label fw-semibold">Password</label>
              <input type="password" class="form-control" placeholder="Create password" required>
            </div>

            <div class="mt-3">
              <label class="form-label fw-semibold">Confirm Password</label>
              <input type="password" class="form-control" placeholder="Confirm password" required>
            </div>

            <div class="form-check mt-4">
              <input class="form-check-input" type="checkbox" id="termsCheck" required>
              <label class="form-check-label text-muted small" for="termsCheck">
                I agree to MOODLAB terms, privacy policy, and conditions.
              </label>
            </div>

            <button type="submit" class="btn btn-dark w-100 mt-4 rounded-pill py-2">
              Register
            </button>

            <p class="text-muted small mt-4 text-center mb-0">
              Already have an account?
              <a href="login.html" target="contentFrame" class="text-decoration-none">
                Login here
              </a>
            </p>

          </form>

        </div>
      </div>
    </div>
  </section>

  <footer class="footer-section text-center py-4 mt-5">
    <p class="mb-0">© 2024 MOODLAB. All Rights Reserved.</p>
  </footer>

</body>
</html>
